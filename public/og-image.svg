<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Subtle Grid Accent -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="360" y1="0" x2="360" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="840" y1="0" x2="840" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Center Card Glassmorphism -->
  <rect x="70" y="65" width="1060" height="500" rx="32" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Badge Top -->
  <rect x="120" y="115" width="280" height="38" rx="19" fill="#2563eb" fill-opacity="0.45" stroke="#60a5fa" stroke-width="1.2" />
  <text x="260" y="139" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">AGENDA RESMI ORGANISASI</text>

  <!-- Main Title -->
  <text x="120" y="225" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">ORBIT <tspan fill="#60a5fa">·</tspan> IMPP</text>

  <!-- Subtitle -->
  <text x="120" y="278" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Organisasi, Rekapitulasi, Birokrasi &amp; Informasi Terpadu</text>
  <text x="120" y="318" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Ikatan Mahasiswa Pelajar Pemalang</text>

  <!-- Horizontal Divider -->
  <line x1="120" y1="358" x2="1010" y2="358" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Feature tags -->
  <g transform="translate(120, 390)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="195" height="42" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="24" cy="21" r="5" fill="#38bdf8" />
    <text x="40" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Kalender 4 Tampilan</text>

    <!-- Tag 2 -->
    <rect x="210" y="0" width="195" height="42" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="234" cy="21" r="5" fill="#a855f7" />
    <text x="250" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Filter 6 Divisi IMPP</text>

    <!-- Tag 3 -->
    <rect x="420" y="0" width="205" height="42" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="444" cy="21" r="5" fill="#22c55e" />
    <text x="460" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Sinkron Realtime</text>

    <!-- Tag 4 -->
    <rect x="640" y="0" width="250" height="42" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" />
    <circle cx="664" cy="21" r="5" fill="#f59e0b" />
    <text x="680" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700">Bagan Struktur Interaktif</text>
  </g>

  <!-- Footer Info -->
  <text x="120" y="495" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Pantau semua jadwal rabul &amp; kegiatan tahunan organisasi tanpa perlu tanya di grup chat</text>
</svg>